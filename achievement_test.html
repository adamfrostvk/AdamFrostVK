<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mega Man X - Achievement Debug</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: white;
        }

        #game-container {
            width: 512px;
            height: 448px;
            max-width: 100%;
        }

        #game {
            width: 100%;
            height: 100%;
        }

        #debug {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;

            height: 300px;

            background: #050505;
            color: #ddd;

            border-top: 3px solid #2680EF;

            z-index: 999999;

            overflow: auto;

            padding: 10px;

            font-family: monospace;
            font-size: 13px;

            white-space: pre-wrap;
        }

        #debug-buttons {
            position: sticky;
            top: 0;

            background: #050505;

            padding-bottom: 8px;

            margin-bottom: 8px;

            border-bottom: 1px solid #333;
        }

        button {
            background: #222;
            color: white;

            border: 1px solid #555;

            padding: 6px 12px;

            margin-right: 5px;

            cursor: pointer;

            font-family: monospace;
        }

        button:hover {
            background: #333;
        }

        .ok {
            color: #4ade80;
        }

        .warn {
            color: #facc15;
        }

        .err {
            color: #f87171;
        }
    </style>
</head>

<body>

    <!-- EXACTAMENTE como megamanx.html -->

    <div id="game-container">
        <div id="game"></div>
    </div>


    <!-- Configuración EXACTA de megamanx.html -->

    <script>
        EJS_player = "#game";
        EJS_core = "snes";
        EJS_gameName = "Mega Man X";
        EJS_AdUrl = "img/mmxad.png";
        EJS_AdSize = ["260px", "180px"];
        EJS_color = "#2680EF";
        EJS_pathtodata = "emulatorjs/data/";
        EJS_gameUrl = "roms/Mega Man X.sfc";
    </script>


    <!-- Debug independiente -->

    <div id="debug">

        <div id="debug-buttons">
            <button onclick="achievementDebugInspect()">
                INSPECCIONAR
            </button>

            <button onclick="achievementDebugClear()">
                LIMPIAR
            </button>
        </div>

        <div id="debug-output"></div>

    </div>


    <script>
        /*
         * IMPORTANTE:
         * Usamos nombres muy específicos para evitar
         * conflictos con variables internas de EmulatorJS.
         */

        var achievementDebugOutput =
            document.getElementById("debug-output");


        function achievementDebugLog(message, type) {

            var line =
                document.createElement("div");

            if (type === "ok") {
                line.className = "ok";
            }

            if (type === "warn") {
                line.className = "warn";
            }

            if (type === "err") {
                line.className = "err";
            }

            line.textContent =
                "[" +
                new Date().toLocaleTimeString() +
                "] " +
                String(message);

            achievementDebugOutput.appendChild(line);

            achievementDebugOutput.scrollTop =
                achievementDebugOutput.scrollHeight;

            console.log(
                "[AchievementDebug]",
                message
            );
        }


        function achievementDebugClear() {

            achievementDebugOutput.innerHTML = "";

        }


        /*
         * Capturar errores JavaScript.
         */

        window.addEventListener(
            "error",
            function (event) {

                achievementDebugLog(
                    "ERROR: " +
                    event.message +
                    " (" +
                    event.filename +
                    ":" +
                    event.lineno +
                    ")",
                    "err"
                );

            }
        );


        window.addEventListener(
            "unhandledrejection",
            function (event) {

                achievementDebugLog(
                    "PROMISE ERROR: " +
                    String(event.reason),
                    "err"
                );

            }
        );


        achievementDebugLog(
            "Página de diagnóstico cargada.",
            "ok"
        );


        achievementDebugLog(
            "Cargando EmulatorJS..."
        );


        /*
         * Comprobar EJS_emulator.
         *
         * loader.js crea esta variable cuando termina
         * de cargar EmulatorJS.
         */

        var achievementDebugWatcher =
            setInterval(
                function () {

                    if (!window.EJS_emulator) {
                        return;
                    }

                    clearInterval(
                        achievementDebugWatcher
                    );

                    achievementDebugLog(
                        "EJS_emulator encontrado.",
                        "ok"
                    );

                    achievementDebugLog(
                        "EmulatorJS está disponible."
                    );

                    try {

                        window.EJS_emulator.on(
                            "start",
                            function () {

                                achievementDebugLog(
                                    "EVENTO: start",
                                    "ok"
                                );

                                achievementDebugInspect();

                            }
                        );

                        achievementDebugLog(
                            "Listener 'start' registrado.",
                            "ok"
                        );

                    } catch (error) {

                        achievementDebugLog(
                            "Error registrando start: " +
                            error,
                            "err"
                        );

                    }

                },
                250
            );


        /*
         * Inspección manual.
         */

        function achievementDebugInspect() {

            achievementDebugLog(
                "========== INSPECCIÓN =========="
            );


            var emulator =
                window.EJS_emulator;


            if (!emulator) {

                achievementDebugLog(
                    "EJS_emulator NO existe.",
                    "warn"
                );

                return;
            }


            achievementDebugLog(
                "EJS_emulator: OK",
                "ok"
            );


            /*
             * GameManager
             */

            var gameManager =
                emulator.gameManager;


            if (!gameManager) {

                achievementDebugLog(
                    "gameManager NO existe.",
                    "warn"
                );

            } else {

                achievementDebugLog(
                    "gameManager: OK",
                    "ok"
                );


                try {

                    achievementDebugLog(
                        "GameManager keys:"
                    );

                    achievementDebugLog(
                        Object.keys(gameManager)
                            .join(", ")
                    );

                } catch (error) {

                    achievementDebugLog(
                        "No se pudieron leer las propiedades de GameManager: " +
                        error,
                        "err"
                    );

                }

            }


            /*
             * Module
             */

            if (!gameManager) {
                return;
            }


            var Module =
                gameManager.Module;


            if (!Module) {

                achievementDebugLog(
                    "gameManager.Module NO existe.",
                    "warn"
                );

                return;
            }


            achievementDebugLog(
                "Module: OK",
                "ok"
            );


            try {

                var moduleKeys =
                    Object.keys(Module);

                achievementDebugLog(
                    "Module tiene " +
                    moduleKeys.length +
                    " propiedades."
                );

                achievementDebugLog(
                    moduleKeys.join(", ")
                );

            } catch (error) {

                achievementDebugLog(
                    "Error leyendo Module: " +
                    error,
                    "err"
                );

            }


            /*
             * HEAP
             */

            achievementDebugLog(
                "Module.HEAPU8: " +
                (
                    Module.HEAPU8
                        ? "EXISTE"
                        : "NO EXISTE"
                )
            );


            if (Module.HEAPU8) {

                achievementDebugLog(
                    "HEAPU8.length = " +
                    Module.HEAPU8.length
                );

            }


            /*
             * Buscar retro/memory/wasm.
             */

            try {

                var interesting =
                    Object.keys(Module)
                        .filter(
                            function (key) {

                                var lower =
                                    key.toLowerCase();

                                return (
                                    lower.indexOf("retro") !== -1 ||
                                    lower.indexOf("memory") !== -1 ||
                                    lower.indexOf("wasm") !== -1 ||
                                    lower.indexOf("core") !== -1
                                );

                            }
                        );


                achievementDebugLog(
                    "Propiedades relacionadas:"
                );

                achievementDebugLog(
                    interesting.length
                        ? interesting.join(", ")
                        : "(ninguna)"
                );

            } catch (error) {

                achievementDebugLog(
                    "Error buscando propiedades: " +
                    error,
                    "err"
                );

            }


            /*
             * Funciones que nos interesan.
             */

            var functions = [
                "_retro_get_memory_data",
                "_retro_get_memory_size",
                "retro_get_memory_data",
                "retro_get_memory_size"
            ];


            for (
                var i = 0;
                i < functions.length;
                i++
            ) {

                var name =
                    functions[i];


                if (
                    typeof Module[name] ===
                    "function"
                ) {

                    achievementDebugLog(
                        "ENCONTRADO: Module." +
                        name,
                        "ok"
                    );

                } else {

                    achievementDebugLog(
                        "No existe: Module." +
                        name
                    );

                }

            }


            achievementDebugLog(
                "========== FIN =========="
            );

        }
    </script>


    <!-- EmulatorJS -->

    <script src="emulatorjs/data/loader.js"></script>

</body>
</html>
