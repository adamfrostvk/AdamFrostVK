<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EmulatorJS Achievement Memory Test</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #fff;
            font-family: monospace;
        }

        #game-container {
            width: 512px;
            height: 448px;
            max-width: 100%;
            margin-bottom: 380px;
        }

        #game {
            width: 100%;
            height: 100%;
        }

        #debug {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;

            height: 360px;

            background: #050505;
            color: #ddd;

            border-top: 3px solid #2680EF;

            z-index: 999999;

            overflow: auto;

            padding: 10px;

            font-family: monospace;
            font-size: 13px;
            line-height: 1.4;

            white-space: pre-wrap;
            word-break: break-word;
        }

        #debug-buttons {
            position: sticky;
            top: 0;

            background: #050505;

            padding-bottom: 8px;
            margin-bottom: 8px;

            border-bottom: 1px solid #333;

            z-index: 2;
        }

        button {
            background: #222;
            color: white;

            border: 1px solid #555;

            padding: 7px 12px;

            margin-right: 5px;

            cursor: pointer;

            font-family: monospace;
        }

        button:hover {
            background: #333;
        }

        .ok {
            color: #4ade80;
        }

        .warn {
            color: #facc15;
        }

        .err {
            color: #f87171;
        }

        .info {
            color: #60a5fa;
        }
    </style>
</head>


<body>

    <!-- ========================================================= -->
    <!-- EMULATOR                                                   -->
    <!-- ========================================================= -->

    <div id="game-container">
        <div id="game"></div>
    </div>


    <!-- ========================================================= -->
    <!-- EMULATORJS CONFIG                                          -->
    <!-- ========================================================= -->

    <script>

        EJS_player = "#game";

        EJS_core = "snes";

        EJS_gameName = "Mega Man X";

        EJS_AdUrl = "img/mmxad.png";

        EJS_AdSize = [
            "260px",
            "180px"
        ];

        EJS_color = "#2680EF";

        EJS_pathtodata =
            "emulatorjs/data/";

        EJS_gameUrl =
            "roms/Mega Man X.sfc";

    </script>


    <!-- ========================================================= -->
    <!-- DEBUG UI                                                   -->
    <!-- ========================================================= -->

    <div id="debug">

        <div id="debug-buttons">

            <button onclick="achievementDebugInspect()">
                INSPECCIONAR
            </button>

            <button onclick="achievementDebugMemory()">
                PROBAR MEMORIA
            </button>

            <button onclick="achievementDebugClear()">
                LIMPIAR
            </button>

        </div>

        <div id="debug-output"></div>

    </div>


    <script>

        /*
         * =========================================================
         * DEBUG
         * =========================================================
         */

        var debugOutput =
            document.getElementById(
                "debug-output"
            );


        function debugLog(
            message,
            type
        ) {

            var line =
                document.createElement(
                    "div"
                );


            if (type === "ok") {
                line.className = "ok";
            }

            if (type === "warn") {
                line.className = "warn";
            }

            if (type === "err") {
                line.className = "err";
            }

            if (type === "info") {
                line.className = "info";
            }


            line.textContent =
                "[" +
                new Date().toLocaleTimeString() +
                "] " +
                String(message);


            debugOutput.appendChild(
                line
            );


            debugOutput.scrollTop =
                debugOutput.scrollHeight;


            console.log(
                "[AchievementDebug]",
                message
            );

        }


        function achievementDebugClear() {

            debugOutput.innerHTML = "";

        }


        /*
         * =========================================================
         * ERRORES GLOBALES
         * =========================================================
         */

        window.addEventListener(
            "error",
            function (event) {

                debugLog(
                    "ERROR: " +
                    event.message +
                    " @ " +
                    event.filename +
                    ":" +
                    event.lineno +
                    ":" +
                    event.colno,
                    "err"
                );

            }
        );


        window.addEventListener(
            "unhandledrejection",
            function (event) {

                debugLog(
                    "PROMISE ERROR: " +
                    String(event.reason),
                    "err"
                );

            }
        );


        debugLog(
            "========================================"
        );

        debugLog(
            "Achievement Memory Debug",
            "info"
        );

        debugLog(
            "Esperando a EmulatorJS..."
        );


        /*
         * =========================================================
         * OBTENER EMULADOR
         * =========================================================
         */

        function getEmulator() {

            if (
                !window.EJS_emulator
            ) {

                debugLog(
                    "EJS_emulator todavía no existe.",
                    "warn"
                );

                return null;

            }


            return window.EJS_emulator;

        }


        function getGameManager() {

            var emulator =
                getEmulator();


            if (!emulator) {
                return null;
            }


            if (
                !emulator.gameManager
            ) {

                debugLog(
                    "gameManager todavía no existe.",
                    "warn"
                );

                return null;

            }


            return emulator.gameManager;

        }


        function getModule() {

            var gameManager =
                getGameManager();


            if (!gameManager) {
                return null;
            }


            if (
                !gameManager.Module
            ) {

                debugLog(
                    "gameManager.Module no existe.",
                    "warn"
                );

                return null;

            }


            return gameManager.Module;

        }


        /*
         * =========================================================
         * INSPECCIÓN BÁSICA
         * =========================================================
         */

        function achievementDebugInspect() {

            debugLog("");

            debugLog(
                "========================================"
            );

            debugLog(
                "INSPECCIÓN",
                "info"
            );

            debugLog(
                "========================================"
            );


            var emulator =
                getEmulator();


            if (!emulator) {
                return;
            }


            debugLog(
                "EJS_emulator: OK",
                "ok"
            );


            var gameManager =
                getGameManager();


            if (!gameManager) {
                return;
            }


            debugLog(
                "gameManager: OK",
                "ok"
            );


            var Module =
                getModule();


            if (!Module) {
                return;
            }


            debugLog(
                "Module: OK",
                "ok"
            );


            /*
             * cwrap
             */

            debugLog("");

            debugLog(
                "------ CWRAP ------"
            );


            debugLog(
                "typeof Module.cwrap = " +
                typeof Module.cwrap
            );


            if (
                typeof Module.cwrap ===
                "function"
            ) {

                debugLog(
                    "Module.cwrap disponible.",
                    "ok"
                );

            } else {

                debugLog(
                    "Module.cwrap NO disponible.",
                    "err"
                );

                return;

            }


            /*
             * HEAP
             */

            debugLog("");

            debugLog(
                "------ HEAP ------"
            );


            var heaps = [
                "HEAP8",
                "HEAP16",
                "HEAPU8",
                "HEAPU16",
                "HEAP32",
                "HEAPU32",
                "HEAPF32",
                "HEAPF64"
            ];


            for (
                var i = 0;
                i < heaps.length;
                i++
            ) {

                var heapName =
                    heaps[i];

                var heap =
                    Module[heapName];


                debugLog(
                    heapName +
                    ": " +
                    (
                        heap
                            ? "OK (" +
                              heap.length +
                              ")"
                            : "NO"
                    ),
                    heap
                        ? "ok"
                        : "warn"
                );

            }


            /*
             * GameManager functions
             */

            debugLog("");

            debugLog(
                "------ GAMEMANAGER FUNCTIONS ------"
            );


            if (
                gameManager.functions
            ) {

                debugLog(
                    Object.keys(
                        gameManager.functions
                    ).join(", ")
                );

            }


            /*
             * Funciones conocidas
             */

            debugLog("");

            debugLog(
                "------ FUNCIONES CONTROL ------"
            );


            testCwrapFunction(
                Module,
                "ejs_set_variable",
                "null",
                [
                    "string",
                    "string"
                ]
            );


            testCwrapFunction(
                Module,
                "get_current_frame_count",
                "number",
                []
            );


            debugLog("");

            debugLog(
                "Inspección terminada.",
                "ok"
            );

        }


        /*
         * =========================================================
         * TEST CWRAP
         * =========================================================
         */

        function testCwrapFunction(
            Module,
            name,
            returnType,
            argTypes
        ) {

            debugLog(
                "Probando cwrap('" +
                name +
                "')..."
            );


            try {

                var fn =
                    Module.cwrap(
                        name,
                        returnType,
                        argTypes
                    );


                debugLog(
                    "cwrap('" +
                    name +
                    "') creado correctamente.",
                    "ok"
                );


                debugLog(
                    "typeof wrapper = " +
                    typeof fn
                );


                return fn;

            } catch (error) {

                debugLog(
                    "cwrap('" +
                    name +
                    "') FALLÓ: " +
                    error,
                    "err"
                );


                return null;

            }

        }


        /*
         * =========================================================
         * PRUEBA DE MEMORIA LIBRETRO
         * =========================================================
         */

        function achievementDebugMemory() {

            debugLog("");

            debugLog(
                "========================================"
            );

            debugLog(
                "PRUEBA DE MEMORIA LIBRETRO",
                "info"
            );

            debugLog(
                "========================================"
            );


            var Module =
                getModule();


            if (!Module) {
                return;
            }


            if (
                typeof Module.cwrap !==
                "function"
            ) {

                debugLog(
                    "Module.cwrap no está disponible.",
                    "err"
                );

                return;

            }


            /*
             * -----------------------------------------------------
             * CONSTANTE LIBRETRO
             * -----------------------------------------------------
             *
             * RETRO_MEMORY_SYSTEM_RAM = 2
             */

            var RETRO_MEMORY_SYSTEM_RAM = 2;


            debugLog(
                "RETRO_MEMORY_SYSTEM_RAM = " +
                RETRO_MEMORY_SYSTEM_RAM
            );


            /*
             * -----------------------------------------------------
             * retro_get_memory_data
             * -----------------------------------------------------
             */

            debugLog("");

            debugLog(
                "------ retro_get_memory_data ------"
            );


            var getMemoryData =
                testCwrapFunction(
                    Module,
                    "retro_get_memory_data",
                    "number",
                    ["number"]
                );


            /*
             * -----------------------------------------------------
             * retro_get_memory_size
             * -----------------------------------------------------
             */

            debugLog("");

            debugLog(
                "------ retro_get_memory_size ------"
            );


            var getMemorySize =
                testCwrapFunction(
                    Module,
                    "retro_get_memory_size",
                    "number",
                    ["number"]
                );


            /*
             * -----------------------------------------------------
             * Si no existen
             * -----------------------------------------------------
             */

            if (
                !getMemoryData ||
                !getMemorySize
            ) {

                debugLog("");

                debugLog(
                    "No se pudieron crear ambos wrappers.",
                    "warn"
                );

                debugLog(
                    "El siguiente paso será revisar las exportaciones del WASM."
                );

                return;

            }


            /*
             * -----------------------------------------------------
             * Obtener tamaño
             * -----------------------------------------------------
             */

            var size;


            try {

                debugLog(
                    "Llamando retro_get_memory_size(2)..."
                );


                size =
                    getMemorySize(
                        RETRO_MEMORY_SYSTEM_RAM
                    );


                debugLog(
                    "Resultado size = " +
                    size,
                    "ok"
                );

            } catch (error) {

                debugLog(
                    "ERROR llamando retro_get_memory_size: " +
                    error,
                    "err"
                );

                return;

            }


            /*
             * -----------------------------------------------------
             * Obtener puntero
             * -----------------------------------------------------
             */

            var ptr;


            try {

                debugLog(
                    "Llamando retro_get_memory_data(2)..."
                );


                ptr =
                    getMemoryData(
                        RETRO_MEMORY_SYSTEM_RAM
                    );


                debugLog(
                    "Resultado ptr = " +
                    ptr,
                    "ok"
                );

            } catch (error) {

                debugLog(
                    "ERROR llamando retro_get_memory_data: " +
                    error,
                    "err"
                );

                return;

            }


            /*
             * -----------------------------------------------------
             * Validación
             * -----------------------------------------------------
             */

            debugLog("");

            debugLog(
                "------ VALIDACIÓN ------"
            );


            if (
                !Number.isFinite(ptr)
            ) {

                debugLog(
                    "El puntero no es un número válido.",
                    "err"
                );

                return;

            }


            if (
                !Number.isFinite(size)
            ) {

                debugLog(
                    "El tamaño no es un número válido.",
                    "err"
                );

                return;

            }


            debugLog(
                "Puntero: " +
                ptr
            );


            debugLog(
                "Tamaño: " +
                size +
                " bytes"
            );


            if (ptr < 0) {

                debugLog(
                    "Puntero negativo.",
                    "err"
                );

                return;

            }


            if (size <= 0) {

                debugLog(
                    "El tamaño es 0 o negativo.",
                    "warn"
                );

                return;

            }


            if (
                !Module.HEAPU8
            ) {

                debugLog(
                    "Module.HEAPU8 no existe.",
                    "err"
                );

                return;

            }


            if (
                ptr + size >
                Module.HEAPU8.length
            ) {

                debugLog(
                    "La región queda fuera de HEAPU8.",
                    "err"
                );

                debugLog(
                    "ptr + size = " +
                    (ptr + size)
                );

                debugLog(
                    "HEAPU8.length = " +
                    Module.HEAPU8.length
                );

                return;

            }


            debugLog(
                "La región está dentro de HEAPU8.",
                "ok"
            );


            /*
             * -----------------------------------------------------
             * Crear vista
             * -----------------------------------------------------
             */

            var ram =
                Module.HEAPU8.subarray(
                    ptr,
                    ptr + size
                );


            debugLog("");

            debugLog(
                "------ RAM ------"
            );


            debugLog(
                "RAM view creada.",
                "ok"
            );


            debugLog(
                "ram.length = " +
                ram.length
            );


            /*
             * -----------------------------------------------------
             * HEX
             * -----------------------------------------------------
             */

            var bytesToShow =
                Math.min(
                    64,
                    ram.length
                );


            var hex = "";


            for (
                var i = 0;
                i < bytesToShow;
                i++
            ) {

                var value =
                    ram[i]
                        .toString(16)
                        .padStart(2, "0");


                hex += value;


                if (
                    i !==
                    bytesToShow - 1
                ) {

                    hex += " ";

                }

            }


            debugLog(
                "Primeros " +
                bytesToShow +
                " bytes:"
            );


            debugLog(
                hex
            );


            /*
             * -----------------------------------------------------
             * Guardar para consola
             * -----------------------------------------------------
             */

            window.achievementDebugRAM =
                ram;


            window.achievementDebugMemoryPointer =
                ptr;


            window.achievementDebugMemorySize =
                size;


            debugLog("");

            debugLog(
                "window.achievementDebugRAM disponible.",
                "ok"
            );


            debugLog(
                "Puedes inspeccionarlo desde DevTools:"
            );


            debugLog(
                "achievementDebugRAM"
            );


            /*
             * -----------------------------------------------------
             * Resumen
             * -----------------------------------------------------
             */

            debugLog("");

            debugLog(
                "========================================"
            );

            debugLog(
                "RESULTADO"
            );

            debugLog(
                "========================================"
            );

            debugLog(
                "Puntero: " +
                ptr
            );

            debugLog(
                "Tamaño: " +
                size
            );

            debugLog(
                "RAM accesible: SÍ",
                "ok"
            );

        }


        /*
         * =========================================================
         * ESPERAR EMULATORJS
         * =========================================================
         */

        var emulatorDetected =
            false;


        var emulatorWatcher =
            setInterval(
                function () {

                    if (
                        emulatorDetected
                    ) {
                        return;
                    }


                    if (
                        !window.EJS_emulator
                    ) {
                        return;
                    }


                    emulatorDetected =
                        true;


                    debugLog(
                        "EJS_emulator detectado.",
                        "ok"
                    );


                    try {

                        window.EJS_emulator.on(
                            "start",
                            function () {

                                debugLog(
                                    "EVENTO: start",
                                    "ok"
                                );


                                /*
                                 * No hacemos la prueba
                                 * automáticamente.
                                 *
                                 * Primero dejamos que el
                                 * emulador termine de iniciar.
                                 */

                                setTimeout(
                                    function () {

                                        achievementDebugInspect();

                                    },
                                    250
                                );

                            }
                        );


                        debugLog(
                            "Listener 'start' registrado.",
                            "ok"
                        );


                    } catch (error) {

                        debugLog(
                            "Error registrando start: " +
                            error,
                            "err"
                        );

                    }

                },
                250
            );

    </script>


    <!-- ========================================================= -->
    <!-- EMULATORJS                                                -->
    <!-- ========================================================= -->

    <script src="emulatorjs/data/loader.js"></script>

</body>

</html>
