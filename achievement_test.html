<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Mega Man X - Achievement Debug
    </title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;

            background: #111;
            color: #fff;

            font-family: monospace;
        }

        #game-container {
            width: 512px;
            height: 448px;

            max-width: 100%;
        }

        #game {
            width: 100%;
            height: 100%;
        }

        #debug {

            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            height: 360px;

            background: #050505;

            color: #ddd;

            border-top: 3px solid #2680EF;

            z-index: 999999;

            overflow: auto;

            padding: 10px;

            font-family: monospace;

            font-size: 13px;

            line-height: 1.4;

            white-space: pre-wrap;

            word-break: break-word;
        }

        #debug-buttons {

            position: sticky;

            top: 0;

            background: #050505;

            padding-bottom: 8px;

            margin-bottom: 8px;

            border-bottom: 1px solid #333;

            z-index: 2;
        }

        button {

            background: #222;

            color: white;

            border: 1px solid #555;

            padding: 7px 12px;

            margin-right: 5px;

            cursor: pointer;

            font-family: monospace;
        }

        button:hover {
            background: #333;
        }

        .ok {
            color: #4ade80;
        }

        .warn {
            color: #facc15;
        }

        .err {
            color: #f87171;
        }

        .title {
            color: #60a5fa;

            font-weight: bold;

            margin-top: 8px;
            margin-bottom: 4px;
        }

    </style>

</head>


<body>


    <!-- ========================================================= -->
    <!-- EMULATOR                                                   -->
    <!-- ========================================================= -->

    <div id="game-container">

        <div id="game"></div>

    </div>


    <!-- ========================================================= -->
    <!-- CONFIGURACIÓN EXACTA DE megamanx.html                      -->
    <!-- ========================================================= -->

    <script>

        EJS_player = "#game";

        EJS_core = "snes";

        EJS_gameName = "Mega Man X";

        EJS_AdUrl = "img/mmxad.png";

        EJS_AdSize = [
            "260px",
            "180px"
        ];

        EJS_color = "#2680EF";

        EJS_pathtodata =
            "emulatorjs/data/";

        EJS_gameUrl =
            "roms/Mega Man X.sfc";

    </script>


    <!-- ========================================================= -->
    <!-- DEBUG                                                       -->
    <!-- ========================================================= -->

    <div id="debug">

        <div id="debug-buttons">

            <button
                onclick="achievementDebugInspect()"
            >
                INSPECCIONAR
            </button>

            <button
                onclick="achievementDebugClear()"
            >
                LIMPIAR
            </button>

        </div>


        <div id="debug-output"></div>

    </div>


    <script>

        /*
         * =========================================================
         * CONSOLA
         * =========================================================
         */

        var achievementDebugOutput =
            document.getElementById(
                "debug-output"
            );


        function achievementDebugLog(
            message,
            type
        ) {

            var line =
                document.createElement("div");


            if (type === "ok") {
                line.className = "ok";
            }

            if (type === "warn") {
                line.className = "warn";
            }

            if (type === "err") {
                line.className = "err";
            }


            line.textContent =
                "[" +
                new Date().toLocaleTimeString() +
                "] " +
                String(message);


            achievementDebugOutput.appendChild(
                line
            );


            achievementDebugOutput.scrollTop =
                achievementDebugOutput.scrollHeight;


            console.log(
                "[AchievementDebug]",
                message
            );

        }


        function achievementDebugClear() {

            achievementDebugOutput.innerHTML = "";

        }


        /*
         * =========================================================
         * ERRORES GLOBALES
         * =========================================================
         */

        window.addEventListener(
            "error",
            function (event) {

                achievementDebugLog(
                    "ERROR: " +
                    event.message +
                    " (" +
                    event.filename +
                    ":" +
                    event.lineno +
                    ")",
                    "err"
                );

            }
        );


        window.addEventListener(
            "unhandledrejection",
            function (event) {

                achievementDebugLog(
                    "PROMISE ERROR: " +
                    String(event.reason),
                    "err"
                );

            }
        );


        achievementDebugLog(
            "========================================"
        );

        achievementDebugLog(
            "Achievement Debug iniciado.",
            "ok"
        );

        achievementDebugLog(
            "Esperando a EmulatorJS..."
        );


        /*
         * =========================================================
         * INSPECCIÓN PRINCIPAL
         * =========================================================
         */

        function achievementDebugInspect() {

            achievementDebugLog(
                ""
            );

            achievementDebugLog(
                "========================================"
            );

            achievementDebugLog(
                "INSPECCIÓN COMPLETA"
            );

            achievementDebugLog(
                "========================================"
            );


            /*
             * -----------------------------------------------------
             * EJS_emulator
             * -----------------------------------------------------
             */

            achievementDebugLog(
                ""
            );

            achievementDebugLog(
                "------ EJS_EMULATOR ------"
            );


            var emulator =
                window.EJS_emulator;


            if (!emulator) {

                achievementDebugLog(
                    "window.EJS_emulator NO existe.",
                    "warn"
                );

                return;

            }


            achievementDebugLog(
                "window.EJS_emulator: OK",
                "ok"
            );


            try {

                var emulatorKeys =
                    Object.keys(emulator);


                achievementDebugLog(
                    "Propiedades:"
                );


                achievementDebugLog(
                    emulatorKeys.join(", ")
                );

            } catch (error) {

                achievementDebugLog(
                    "Error leyendo EJS_emulator: " +
                    error,
                    "err"
                );

            }


            /*
             * -----------------------------------------------------
             * GAMEMANAGER
             * -----------------------------------------------------
             */

            achievementDebugLog(
                ""
            );

            achievementDebugLog(
                "------ GAMEMANAGER ------"
            );


            var gameManager =
                emulator.gameManager;


            if (!gameManager) {

                achievementDebugLog(
                    "gameManager NO existe.",
                    "warn"
                );

                achievementDebugLog(
                    "Es posible que el core todavía no haya terminado de iniciar."
                );

                return;

            }


            achievementDebugLog(
                "gameManager: OK",
                "ok"
            );


            try {

                achievementDebugLog(
                    "Propiedades:"
                );


                achievementDebugLog(
                    Object.keys(
                        gameManager
                    ).join(", ")
                );

            } catch (error) {

                achievementDebugLog(
                    "Error leyendo GameManager: " +
                    error,
                    "err"
                );

            }


            /*
             * -----------------------------------------------------
             * GAMEMANAGER.EJS
             * -----------------------------------------------------
             */

            achievementDebugLog(
                ""
            );

            achievementDebugLog(
                "------ GAMEMANAGER.EJS ------"
            );


            var ejs =
                gameManager.EJS;


            if (!ejs) {

                achievementDebugLog(
                    "gameManager.EJS NO existe.",
                    "warn"
                );

            } else {

                achievementDebugLog(
                    "gameManager.EJS: OK",
                    "ok"
                );


                try {

                    var ejsKeys =
                        Object.keys(ejs);


                    achievementDebugLog(
                        "Propiedades:"
                    );


                    achievementDebugLog(
                        ejsKeys.join(", ")
                    );


                } catch (error) {

                    achievementDebugLog(
                        "Error leyendo EJS: " +
                        error,
                        "err"
                    );

                }

            }


            /*
             * -----------------------------------------------------
             * GAMEMANAGER.FUNCTIONS
             * -----------------------------------------------------
             */

            achievementDebugLog(
                ""
            );

            achievementDebugLog(
                "------ GAMEMANAGER.FUNCTIONS ------"
            );


            var functions =
                gameManager.functions;


            if (!functions) {

                achievementDebugLog(
                    "gameManager.functions NO existe.",
                    "warn"
                );

            } else {

                achievementDebugLog(
                    "gameManager.functions: OK",
                    "ok"
                );


                try {

                    var functionKeys =
                        Object.keys(
                            functions
                        );


                    achievementDebugLog(
                        "Propiedades:"
                    );


                    achievementDebugLog(
                        functionKeys.join(", ")
                    );


                    /*
                     * Solo funciones
                     */

                    var callableFunctions =
                        functionKeys.filter(
                            function (key) {

                                return (
                                    typeof
                                    functions[key] ===
                                    "function"
                                );

                            }
                        );


                    achievementDebugLog(
                        ""
                    );

                    achievementDebugLog(
                        "Funciones:"
                    );


                    achievementDebugLog(
                        callableFunctions.length
                            ? callableFunctions.join(", ")
                            : "(ninguna)"
                    );


                } catch (error) {

                    achievementDebugLog(
                        "Error leyendo functions: " +
                        error,
                        "err"
                    );

                }

            }


            /*
             * -----------------------------------------------------
             * GAMEMANAGER.FS
             * -----------------------------------------------------
             */

            achievementDebugLog(
                ""
            );

            achievementDebugLog(
                "------ GAMEMANAGER.FS ------"
            );


            var fs =
                gameManager.FS;


            if (!fs) {

                achievementDebugLog(
                    "gameManager.FS NO existe.",
                    "warn"
                );

            } else {

                achievementDebugLog(
                    "gameManager.FS: OK",
                    "ok"
                );


                try {

                    achievementDebugLog(
                        "Propiedades:"
                    );


                    achievementDebugLog(
                        Object.keys(fs).join(", ")
                    );


                } catch (error) {

                    achievementDebugLog(
                        "Error leyendo FS: " +
                        error,
                        "err"
                    );

                }

            }


            /*
             * -----------------------------------------------------
             * MODULE
             * -----------------------------------------------------
             */

            achievementDebugLog(
                ""
            );

            achievementDebugLog(
                "------ MODULE ------"
            );


            var Module =
                gameManager.Module;


            if (!Module) {

                achievementDebugLog(
                    "gameManager.Module NO existe.",
                    "warn"
                );

                return;

            }


            achievementDebugLog(
                "Module: OK",
                "ok"
            );


            /*
             * Module keys
             */

            try {

                var moduleKeys =
                    Object.keys(
                        Module
                    );


                achievementDebugLog(
                    "Module tiene " +
                    moduleKeys.length +
                    " propiedades."
                );


                achievementDebugLog(
                    moduleKeys.join(", ")
                );


            } catch (error) {

                achievementDebugLog(
                    "Error leyendo Module: " +
                    error,
                    "err"
                );

            }


            /*
             * -----------------------------------------------------
             * MODULE FUNCTIONS
             * -----------------------------------------------------
             */

            achievementDebugLog(
                ""
            );

            achievementDebugLog(
                "------ MODULE FUNCTIONS ------"
            );


            try {

                var moduleFunctions =
                    Object.keys(
                        Module
                    ).filter(
                        function (key) {

                            return (
                                typeof
                                Module[key] ===
                                "function"
                            );

                        }
                    );


                achievementDebugLog(
                    "Funciones exportadas:"
                );


                achievementDebugLog(
                    moduleFunctions.length
                        ? moduleFunctions.join(", ")
                        : "(ninguna)"
                );


            } catch (error) {

                achievementDebugLog(
                    "Error buscando funciones Module: " +
                    error,
                    "err"
                );

            }


            /*
             * -----------------------------------------------------
             * HEAP
             * -----------------------------------------------------
             */

            achievementDebugLog(
                ""
            );

            achievementDebugLog(
                "------ HEAP ------"
            );


            achievementDebugLog(
                "HEAP8: " +
                (
                    Module.HEAP8
                        ? "OK"
                        : "NO"
                )
            );


            achievementDebugLog(
                "HEAP16: " +
                (
                    Module.HEAP16
                        ? "OK"
                        : "NO"
                )
            );


            achievementDebugLog(
                "HEAPU8: " +
                (
                    Module.HEAPU8
                        ? "OK"
                        : "NO"
                )
            );


            achievementDebugLog(
                "HEAPU16: " +
                (
                    Module.HEAPU16
                        ? "OK"
                        : "NO"
                )
            );


            achievementDebugLog(
                "HEAP32: " +
                (
                    Module.HEAP32
                        ? "OK"
                        : "NO"
                )
            );


            achievementDebugLog(
                "HEAPU32: " +
                (
                    Module.HEAPU32
                        ? "OK"
                        : "NO"
                )
            );


            if (Module.HEAPU8) {

                achievementDebugLog(
                    "HEAPU8.length = " +
                    Module.HEAPU8.length
                );

            }


            /*
             * -----------------------------------------------------
             * ASM
             * -----------------------------------------------------
             */

            achievementDebugLog(
                ""
            );

            achievementDebugLog(
                "------ MODULE.ASM ------"
            );


            if (Module.asm) {

                achievementDebugLog(
                    "Module.asm: OK",
                    "ok"
                );


                try {

                    achievementDebugLog(
                        Object.keys(
                            Module.asm
                        ).join(", ")
                    );


                } catch (error) {

                    achievementDebugLog(
                        "Error leyendo Module.asm: " +
                        error,
                        "err"
                    );

                }

            } else {

                achievementDebugLog(
                    "Module.asm no existe."
                );

            }


            /*
             * -----------------------------------------------------
             * FUNCIONES DE MEMORIA / LIBRETRO
             * -----------------------------------------------------
             */

            achievementDebugLog(
                ""
            );

            achievementDebugLog(
                "------ MEMORY / LIBRETRO ------"
            );


            var memoryNames = [

                "_retro_get_memory_data",

                "_retro_get_memory_size",

                "retro_get_memory_data",

                "retro_get_memory_size",

                "_retro_load_game",

                "_retro_run",

                "_retro_reset",

                "_retro_get_system_info",

                "_retro_get_system_av_info",

                "_retro_set_environment",

                "_retro_init",

                "_retro_deinit"

            ];


            for (
                var i = 0;
                i < memoryNames.length;
                i++
            ) {

                var name =
                    memoryNames[i];


                if (
                    typeof Module[name] ===
                    "function"
                ) {

                    achievementDebugLog(
                        "ENCONTRADO: Module." +
                        name,
                        "ok"
                    );

                } else {

                    achievementDebugLog(
                        "No existe: Module." +
                        name
                    );

                }

            }


            /*
             * -----------------------------------------------------
             * BÚSQUEDA GENERAL
             * -----------------------------------------------------
             */

            achievementDebugLog(
                ""
            );

            achievementDebugLog(
                "------ BÚSQUEDA GENERAL ------"
            );


            try {

                var interesting =
                    Object.keys(
                        Module
                    ).filter(
                        function (key) {

                            var lower =
                                key.toLowerCase();


                            return (

                                lower.indexOf(
                                    "retro"
                                ) !== -1

                                ||

                                lower.indexOf(
                                    "memory"
                                ) !== -1

                                ||

                                lower.indexOf(
                                    "ram"
                                ) !== -1

                                ||

                                lower.indexOf(
                                    "wasm"
                                ) !== -1

                                ||

                                lower.indexOf(
                                    "core"
                                ) !== -1

                                ||

                                lower.indexOf(
                                    "save"
                                ) !== -1

                                ||

                                lower.indexOf(
                                    "state"
                                ) !== -1

                                ||

                                lower.indexOf(
                                    "cheat"
                                ) !== -1

                                ||

                                lower.indexOf(
                                    "variable"
                                ) !== -1

                            );

                        }
                    );


                achievementDebugLog(
                    interesting.length
                        ? interesting.join(", ")
                        : "(ninguna)"
                );


            } catch (error) {

                achievementDebugLog(
                    "Error en búsqueda: " +
                    error,
                    "err"
                );

            }


            /*
             * -----------------------------------------------------
             * FUNCIONES ESPECIALES CONOCIDAS
             * -----------------------------------------------------
             */

            achievementDebugLog(
                ""
            );

            achievementDebugLog(
                "------ FUNCIONES EJS CONOCIDAS ------"
            );


            var knownFunctions = [

                "_ejs_set_variable",

                "_get_core_options",

                "_get_current_frame_count",

                "_cmd_take_screenshot",

                "_system_restart",

                "_load_state",

                "_cmd_save_state",

                "_cmd_savefiles",

                "_set_cheat",

                "_reset_cheat",

                "_simulate_input",

                "_malloc"

            ];


            for (
                var j = 0;
                j < knownFunctions.length;
                j++
            ) {

                var known =
                    knownFunctions[j];


                if (
                    typeof Module[known] ===
                    "function"
                ) {

                    achievementDebugLog(
                        "OK: " +
                        known,
                        "ok"
                    );

                } else {

                    achievementDebugLog(
                        "NO: " +
                        known
                    );

                }

            }


            /*
             * -----------------------------------------------------
             * FINAL
             * -----------------------------------------------------
             */

            achievementDebugLog(
                ""
            );

            achievementDebugLog(
                "========================================"
            );

            achievementDebugLog(
                "FIN DE INSPECCIÓN"
            );

            achievementDebugLog(
                "========================================"
            );

        }


        /*
         * =========================================================
         * ESPERAR A EMULATORJS
         * =========================================================
         */

        var achievementDebugStarted =
            false;


        var achievementDebugWatcher =
            setInterval(
                function () {

                    if (
                        achievementDebugStarted
                    ) {

                        return;

                    }


                    if (
                        !window.EJS_emulator
                    ) {

                        return;

                    }


                    achievementDebugStarted =
                        true;


                    achievementDebugLog(
                        "EJS_emulator detectado.",
                        "ok"
                    );


                    try {

                        window.EJS_emulator.on(
                            "start",
                            function () {

                                achievementDebugLog(
                                    "EVENTO: start",
                                    "ok"
                                );


                                achievementDebugInspect();

                            }
                        );


                        achievementDebugLog(
                            "Listener 'start' registrado.",
                            "ok"
                        );


                    } catch (error) {

                        achievementDebugLog(
                            "Error registrando evento start: " +
                            error,
                            "err"
                        );

                    }

                },
                250
            );

    </script>


    <!-- ========================================================= -->
    <!-- EMULATORJS                                                 -->
    <!-- ========================================================= -->

    <script
        src="emulatorjs/data/loader.js"
    ></script>


</body>

</html>
