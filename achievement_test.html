<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mega Man X - Achievement Debug</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #fff;
            font-family: monospace;
        }

        #game {
            width: 512px;
            height: 448px;
            max-width: 100%;
        }

        #debug {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;

            height: 35vh;

            background: #050505;
            border-top: 2px solid #2680EF;

            overflow-y: auto;

            padding: 10px;

            white-space: pre-wrap;
            word-break: break-word;

            font-size: 13px;
        }

        #debug-header {
            position: sticky;
            top: 0;

            background: #050505;

            border-bottom: 1px solid #333;

            padding-bottom: 8px;
            margin-bottom: 8px;
        }

        button {
            background: #222;
            color: #fff;

            border: 1px solid #555;

            padding: 6px 12px;

            cursor: pointer;

            font-family: monospace;
        }

        button:hover {
            background: #333;
        }

        .info {
            color: #ccc;
        }

        .success {
            color: #4ade80;
        }

        .warning {
            color: #facc15;
        }

        .error {
            color: #f87171;
        }
    </style>
</head>

<body>

    <div id="game"></div>

    <div id="debug">

        <div id="debug-header">
            <button onclick="clearDebug()">
                Limpiar
            </button>

            <button onclick="inspect()">
                Inspeccionar
            </button>
        </div>

        <div id="debug-output"></div>

    </div>


    <!-- ========================================================= -->
    <!-- CONFIGURACIÓN EXACTA DE megamanx.html                     -->
    <!-- ========================================================= -->

    <script>

        EJS_player = "#game";

        EJS_core = "snes";

        EJS_gameName = "Mega Man X";

        EJS_AdUrl = "img/mmxad.png";

        EJS_AdSize = ["260px", "180px"];

        EJS_color = "#2680EF";

        EJS_pathtodata = "emulatorjs/data/";

        EJS_gameUrl = "roms/Mega Man X.sfc";

    </script>


    <!-- ========================================================= -->
    <!-- DEBUG                                                      -->
    <!-- ========================================================= -->

    <script>

        const output =
            document.getElementById("debug-output");


        function debug(message, type = "info") {

            const line =
                document.createElement("div");

            line.className = type;

            const time =
                new Date().toLocaleTimeString();

            line.textContent =
                "[" + time + "] " + message;

            output.appendChild(line);

            output.scrollTop =
                output.scrollHeight;

            console.log(
                "[AchievementDebug]",
                message
            );
        }


        function clearDebug() {

            output.innerHTML = "";

        }


        function inspect() {

            debug("================================");
            debug("INSPECCIÓN");
            debug("================================");


            /*
             * EJS_emulator
             */

            if (!window.EJS_emulator) {

                debug(
                    "EJS_emulator NO existe",
                    "warning"
                );

                return;
            }


            debug(
                "EJS_emulator encontrado",
                "success"
            );


            const emulator =
                window.EJS_emulator;


            /*
             * Propiedades
             */

            try {

                debug(
                    "Emulator properties:"
                );

                debug(
                    Object.keys(emulator)
                );

            } catch (e) {

                debug(
                    "Error leyendo Emulator: " + e,
                    "error"
                );

            }


            /*
             * GameManager
             */

            const gm =
                emulator.gameManager;


            if (!gm) {

                debug(
                    "gameManager NO existe",
                    "warning"
                );

                return;
            }


            debug(
                "gameManager encontrado",
                "success"
            );


            try {

                debug(
                    "GameManager properties:"
                );

                debug(
                    Object.keys(gm)
                );

            } catch (e) {

                debug(
                    "Error leyendo GameManager: " + e,
                    "error"
                );

            }


            /*
             * Module
             */

            const Module =
                gm.Module;


            if (!Module) {

                debug(
                    "Module NO existe",
                    "warning"
                );

                return;
            }


            debug(
                "Module encontrado",
                "success"
            );


            /*
             * Module properties
             */

            try {

                const keys =
                    Object.keys(Module);

                debug(
                    "Module tiene " +
                    keys.length +
                    " propiedades"
                );

                debug(
                    keys
                );

            } catch (e) {

                debug(
                    "Error leyendo Module: " + e,
                    "error"
                );

            }


            /*
             * HEAP
             */

            debug(
                "HEAPU8: " +
                (Module.HEAPU8 ? "SI" : "NO")
            );

            if (Module.HEAPU8) {

                debug(
                    "HEAPU8.length = " +
                    Module.HEAPU8.length
                );

            }


            /*
             * asm
             */

            debug(
                "Module.asm: " +
                (Module.asm ? "SI" : "NO")
            );


            if (Module.asm) {

                try {

                    debug(
                        "Module.asm properties:"
                    );

                    debug(
                        Object.keys(Module.asm)
                    );

                } catch (e) {

                    debug(
                        "Error leyendo Module.asm: " +
                        e,
                        "error"
                    );

                }

            }


            /*
             * Buscar funciones relacionadas
             */

            const search =
                Object.keys(Module).filter(
                    key => {

                        const k =
                            key.toLowerCase();

                        return (
                            k.includes("retro") ||
                            k.includes("memory") ||
                            k.includes("core") ||
                            k.includes("wasm")
                        );

                    }
                );


            debug(
                "Propiedades relacionadas:"
            );

            debug(search);


            /*
             * Funciones que nos interesan
             */

            const functions = [

                "_retro_get_memory_data",

                "_retro_get_memory_size",

                "retro_get_memory_data",

                "retro_get_memory_size"

            ];


            for (const name of functions) {

                if (
                    typeof Module[name] ===
                    "function"
                ) {

                    debug(
                        "ENCONTRADO: " +
                        name,
                        "success"
                    );

                } else {

                    debug(
                        "No encontrado: " +
                        name
                    );

                }

            }

        }


        /*
         * =========================================================
         * ESPERAR A QUE EMULATORJS ESTÉ DISPONIBLE
         * =========================================================
         */

        let started = false;


        function waitForEmulator() {

            if (started) {
                return;
            }


            if (!window.EJS_emulator) {

                return;
            }


            started = true;


            debug(
                "EJS_emulator detectado",
                "success"
            );


            /*
             * Escuchar START
             */

            try {

                window.EJS_emulator.on(
                    "start",
                    function () {

                        debug(
                            "Evento START recibido",
                            "success"
                        );

                        inspect();

                    }
                );


                debug(
                    "Listener START registrado",
                    "success"
                );


            } catch (e) {

                debug(
                    "Error registrando START: " +
                    e,
                    "error"
                );

            }


            /*
             * Escuchar READY
             */

            try {

                window.EJS_emulator.on(
                    "ready",
                    function () {

                        debug(
                            "Evento READY recibido",
                            "success"
                        );

                        inspect();

                    }
                );


            } catch (e) {

                debug(
                    "Error registrando READY: " +
                    e,
                    "error"
                );

            }


            /*
             * Inspección inmediata
             */

            inspect();

        }


        /*
         * Comprobar cada 250ms.
         *
         * Esto es SOLO para el diagnóstico.
         * No formará parte de achievement.js.
         */

        setInterval(
            waitForEmulator,
            250
        );


        debug(
            "Debug iniciado",
            "success"
        );

        debug(
            "Esperando a EmulatorJS..."
        );

    </script>


    <!-- ========================================================= -->
    <!-- EMULATORJS                                                 -->
    <!-- ========================================================= -->

    <script src="emulatorjs/data/loader.js"></script>


</body>
</html>
